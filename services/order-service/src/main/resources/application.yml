spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:wcr}
    password: ${DB_PASSWORD:wcr}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:wcr}
    password: ${RABBITMQ_PASSWORD:wcr}
    publisher-confirm-type: simple   # OutboxRelay waits for each confirm
    connection-timeout: 3s           # a broker that is shutting down accepts TCP but never answers
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: lz4
      properties:
        max.block.ms: 5000   # fail an outbox send fast when Kafka is down (default waits 60 s)

server:
  port: ${PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

orders:
  generator:
    per-minute: ${ORDERS_PER_MINUTE:6}   # 0 turns it off
  outbox:
    enabled: true
    poll-interval: PT0.2S
